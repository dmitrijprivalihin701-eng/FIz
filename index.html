<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФизЛабо — учебное оборудование для школ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #0F0F10;
    line-height: 1.5;
  }

  /* ШАПКА */
  .header {
    width: 100%;
    height: 80px; /* Сделали чуть ниже */
    border-bottom: 1px solid #E0E0E0;
    display: flex;
    align-items: center;
    padding: 0 40px; /* Уменьшили отступы по краям */
    justify-content: space-between;
    background: #ffffff;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  /* Группируем логотип и иконку */
  .logo-group {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: #1A5FB4;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
  }
  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: #0F0F10;
  }

  /* Меню теперь идет сразу после логотипа */
  .nav {
    display: flex;
    gap: 32px;
    margin-left: 40px;
    margin-right: auto; /* Прижимает меню влево, а остальное вправо */
  }
  .nav a {
    font-size: 15px;
    color: #666;
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav a:hover { color: #1A5FB4; }

  /* Правая часть: телефон, поиск, корзина */
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .phone {
    font-size: 15px;
    font-weight: 600;
    color: #0F0F10;
  }
  .header-icon {
    font-size: 20px;
    color: #666;
    text-decoration: none;
    cursor: pointer;
  }
  .header-icon:hover {
    color: #1A5FB4;
  }
</style>
</head>
<body>

<!-- ШАПКА -->
<header class="header">
  <a href="#" class="logo-group">
    <div class="logo-icon">Ф</div>
    <span class="logo-text">ФизЛабо</span>
  </a>
  
  <nav class="nav">
    <a href="#">Каталог</a>
    <a href="#">Доставка</a>
    <a href="#">О нас</a>
    <a href="#">Контакты</a>
  </nav>
  
  <div class="header-right">
    <span class="phone">+7 (499) 123-45-67</span>
    <a href="#" class="header-icon">🔍</a>
    <a href="#" class="header-icon">🛒</a>
  </div>
</header>

</body>
</html>
