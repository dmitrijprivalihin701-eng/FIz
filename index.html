<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФизЛабо — учебное оборудование для школ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #0F0F10;
    line-height: 1.5;
  }

  /* ОБЩИЕ КЛАССЫ */
  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 40px;
    width: 100%;
  }
  .btn {
    display: inline-block;
    background: #1A5FB4;
    color: #ffffff;
    padding: 16px 32px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s;
    border: none;
    cursor: pointer;
  }
  .btn:hover { background: #154a8e; }

  /* ШАПКА */
  .header {
    width: 100%;
    height: 80px;
    border-bottom: 1px solid #E0E0E0;
    background: #ffffff;
    position: sticky;
    top: 0;
    z-index: 100;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 40px;
  }
  
  .logo-group {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    justify-self: start;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: #1A5FB4;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
  }
  .logo-text { font-size: 22px; font-weight: 700; color: #0F0F10; }

  .nav {
    display: flex;
    gap: 32px;
    justify-self: center;
  }
  .nav a {
    font-size: 15px;
    color: #666;
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav a:hover { color: #1A5FB4; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
    justify-self: end;
  }
  .phone { font-size: 15px; font-weight: 600; color: #0F0F10; }
  .header-icon {
    font-size: 20px;
    color: #0F0F10;
    text-decoration: none;
    display: flex;
    align-items: center;
  }
  .header-icon:hover { color: #1A5FB4; }
  .cart-count { font-size: 14px; margin-left: 4px; }

  /* HERO БЛОК */
  .hero {
    padding: 80px 0;
    background: #ffffff;
  }
  .hero-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
  }
  .hero-text {
    flex: 1;
    max-width: 600px;
  }
  .hero-text h1 {
    font-size: 46px; /* Уменьшили, чтобы влезало в 3 строки */
    line-height: 1.15;
    font-weight: 700;
    color: #0F0F10;
    margin-bottom: 24px;
    max-width: 560px;
  }
  .hero-text p {
    font-size: 18px;
    line-height: 1.6;
    color: #666666;
    margin-bottom: 40px;
    max-width: 500px;
  }
  .hero-image {
    flex: 1;
    display: flex;
    justify-content: flex-end;
  }
  .hero-image img {
    width: 100%;
    max-width: 600px;
    height: auto;
    border-radius: 16px;
    object-fit: cover;
  }

  /* АДАПТИВ ДЛЯ ТЕЛЕФОНОВ */
  @media (max-width: 900px) {
    .hero-container {
      flex-direction: column;
      text-align: center;
      gap: 40px;
    }
    .hero-text h1 { font-size: 36px; margin: 0 auto 24px; }
    .hero-text p { margin: 0 auto 32px; }
    .hero-image { justify-content: center; }
    .header { display: flex; flex-wrap: wrap; height: auto; padding: 20px; gap: 20px; }
    .nav { display: none; } /* На телефоне прячем меню */
  }
</style>
</head>
<body>

<!-- ШАПКА -->
<header class="header">
  <a href="#" class="logo-group">
    <div class="logo-icon">Ф</div>
    <span class="logo-text">ФизЛабо</span>
  </a>
  
  <nav class="nav">
    <a href="#">Каталог</a>
    <a href="#">Доставка</a>
    <a href="#">О нас</a>
    <a href="#">Контакты</a>
  </nav>
  
  <div class="header-right">
    <span class="phone">+7 (499) 123-45-67</span>
    <a href="#" class="header-icon">🔍</a>
    <a href="#" class="header-icon">
      🛒 <span class="cart-count">0</span>
    </a>
  </div>
</header>

<!-- HERO БЛОК -->
<section class="hero">
  <div class="container hero-container">
    <div class="hero-text">
      <h1>Учебное оборудование для школ напрямую от производителя</h1>
      <p>Собственное производство с 2007 года: комплекты по физике, химии и биологии под ФГОС, с доставкой по всей России.</p>
      <a href="#" class="btn">Смотреть каталог</a>
    </div>
    <div class="hero-image">
      <!-- Взял похожую иллюстрацию с бесплатного фотостока -->
      <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?q=80&w=1200&auto=format&fit=crop" alt="Лабораторное оборудование">
    </div>
  </div>
</section>

</body>
</html>
