<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФизЛабо — учебное оборудование для школ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #0F0F10;
  }

  /* ШАПКА НА СЕТКЕ */
  .header {
    width: 100%;
    height: 80px;
    border-bottom: 1px solid #E0E0E0;
    background: #ffffff;
    position: sticky;
    top: 0;
    z-index: 100;
    
    /* Делаем 3 равные колонки: лево, центр, право */
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 40px;
  }
  
  /* ЛЕВАЯ ЧАСТЬ */
  .logo-group {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    justify-self: start; /* Прижимаем влево */
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: #1A5FB4;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
  }
  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: #0F0F10;
  }

  /* ЦЕНТР (МЕНЮ) */
  .nav {
    display: flex;
    gap: 32px;
    justify-self: center; /* Ровно по центру */
  }
  .nav a {
    font-size: 15px;
    color: #666;
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav a:hover { color: #1A5FB4; }

  /* ПРАВАЯ ЧАСТЬ */
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
    justify-self: end; /* Прижимаем вправо */
  }
  .phone {
    font-size: 15px;
    font-weight: 600;
    color: #0F0F10;
  }
  .header-icon {
    font-size: 20px;
    color: #0F0F10;
    text-decoration: none;
    display: flex;
    align-items: center;
  }
  .header-icon:hover { color: #1A5FB4; }
  
  /* Иконка корзины со счетчиком */
  .cart-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .cart-count {
    font-size: 14px;
    margin-left: 4px;
  }
</style>
</head>
<body>

<!-- ШАПКА -->
<header class="header">
  <!-- Левая часть: Логотип -->
  <a href="#" class="logo-group">
    <div class="logo-icon">Ф</div>
    <span class="logo-text">ФизЛабо</span>
  </a>
  
  <!-- Центр: Меню -->
  <nav class="nav">
    <a href="#">Каталог</a>
    <a href="#">Доставка</a>
    <a href="#">О нас</a>
    <a href="#">Контакты</a>
  </nav>
  
  <!-- Правая часть: Контакты и иконки -->
  <div class="header-right">
    <span class="phone">+7 (499) 123-45-67</span>
    <a href="#" class="header-icon">🔍</a>
    <a href="#" class="header-icon">
      🛒 <span class="cart-count">0</span>
    </a>
  </div>
</header>

</body>
</html>
