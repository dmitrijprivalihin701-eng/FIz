<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФизЛабо — учебное оборудование для школ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #0F0F10;
    line-height: 1.5;
  }

  /* ШАПКА */
  .header {
    width: 100%;
    height: 120px;
    border-bottom: 1px solid #E0E0E0;
    display: flex;
    align-items: center;
    padding: 0 80px;
    justify-content: space-between;
    background: #ffffff;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 24px;
    font-weight: 700;
    color: #1A5FB4;
    text-decoration: none;
  }
  .nav {
    display: flex;
    gap: 40px;
  }
  .nav a {
    font-size: 16px;
    color: #0F0F10;
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav a:hover { color: #1A5FB4; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .phone {
    font-size: 15px;
    font-weight: 600;
    color: #0F0F10;
  }
  .cart {
    font-size: 15px;
    font-weight: 600;
    color: #1A5FB4;
    text-decoration: none;
  }
</style>
</head>
<body>

<!-- ШАПКА -->
<header class="header">
  <a href="#" class="logo">ФизЛабо</a>
  <nav class="nav">
    <a href="#">Каталог</a>
    <a href="#">Доставка</a>
    <a href="#">О нас</a>
    <a href="#">Контакты</a>
  </nav>
  <div class="header-right">
    <span class="phone">+7 (499) 236-13-56</span>
    <a href="#" class="cart">Корзина (0)</a>
  </div>
</header>

</body>
</html>
